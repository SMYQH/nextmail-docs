name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 部署到 Cloudflare
    runs-on: ubuntu-latest
    # 只有官方仓库的主分支和版本标签可以发布。
    if: github.repository == 'SMYQH/nextmail-docs'
    environment:
      name: production
      url: ${{ vars.DOCS_SITE_URL }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 生成 Fluent 设计令牌
        run: npm run tokens:generate

      - name: 构建站点
        run: npx docusaurus build
        env:
          # 影响 canonical 与 hreflang 链接，必须是站点的真实公开地址。
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}

      - name: 部署静态资源到 Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 冒烟测试
        run: |
          BASE="${DOCS_SITE_URL:-${{ vars.DOCS_SITE_URL }}}"
          if [ -z "$BASE" ]; then
            echo "未配置 DOCS_SITE_URL，跳过冒烟测试"
            exit 0
          fi
          for path in / /en/ /zh-CN/ /en/getting-started/overview /zh-CN/getting-started/overview; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}${path}")
            echo "${path} -> ${status}"
            case "$status" in
              200|301|302) ;;
              *) echo "路径 ${path} 返回 ${status}"; exit 1 ;;
            esac
          done
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
